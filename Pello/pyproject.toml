[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pello-autopilot"
version = "0.1.0"
description = "Pello local development orchestrator prototype"
requires-python = ">=3.10"
dependencies = ["openai-codex==0.163.0"]

[project.scripts]
pello = "athis_autopilot.cli:main"

[tool.setuptools.packages.find]
include = ["athis_autopilot*"]
